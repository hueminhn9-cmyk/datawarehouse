name: instacart-dw

services:
  mariadb:
    image: mariadb:11.4
    container_name: instacart_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: instacart_dw
      MARIADB_USER: instacart_user
      MARIADB_PASSWORD: instacart_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck-sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  streamlit_app:
    build: .
    container_name: instacart_streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=instacart_dw
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
